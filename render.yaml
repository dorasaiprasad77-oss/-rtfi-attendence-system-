services:
  - type: web
    name: rfid-attendance-api
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build && npx prisma db push --accept-data-loss && npx ts-node prisma/seed.ts
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rfid-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://dashboard-chi-beryl-74.vercel.app
      - key: PORT
        value: 10000

databases:
  - name: rfid-postgres
    plan: free
    databaseName: rfid_attendance
